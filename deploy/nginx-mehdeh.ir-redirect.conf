# mehdeh.ir — redirect only. Path and query are preserved.
# Origin HTTPS is Let's Encrypt. Public HTTPS needs Arvan edge SSL (Full).

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mehdeh.ir www.mehdeh.ir;

    ssl_certificate /etc/letsencrypt/live/mehdeh.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mehdeh.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 $scheme://mehdi-dehghani.ir$request_uri;
}
