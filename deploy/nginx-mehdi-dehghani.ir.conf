# mehdi-dehghani.ir — Nginx
# Next.js standalone on 127.0.0.1:3002

upstream mehdi_dehghani_next {
    server 127.0.0.1:3002;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.mehdi-dehghani.ir;
    return 301 $scheme://mehdi-dehghani.ir$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mehdi-dehghani.ir;

    client_max_body_size 8m;

    location / {
        proxy_pass http://mehdi_dehghani_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
